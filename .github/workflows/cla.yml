name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Signatures are recorded by commit, so the workflow needs write access
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Lite"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/pcowensbot/Hal/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "pcowensbot,dependabot[bot],*[bot]"
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, HAL requires a signed
            Contributor Licence Agreement — it keeps the project's dual licence
            (free AGPL + commercial) workable, you keep your copyright, and you
            sign once for all future contributions. Please read the
            [CLA](https://github.com/pcowensbot/Hal/blob/main/CLA.md) and comment
            with the sentence below to sign.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA ✅"
